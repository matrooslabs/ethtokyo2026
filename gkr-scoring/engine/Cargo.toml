[package]
name = "mania-gkr"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sumcheck/GKR + Zeromorph proofs for OSUMANIA_ONCHAIN_RULESET_V1 scoring"

[lib]
name = "mania_gkr"
path = "src/lib.rs"

[[bin]]
name = "mania-gkr"
path = "src/bin/mania-gkr.rs"

[dependencies]
halo2curves = { version = "0.10.0", features = ["std"] }
rayon = "1"
tiny-keccak = { version = "2", features = ["keccak"] }
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
mania-scoring-core = { path = "../../sp1-scoring/core" }
