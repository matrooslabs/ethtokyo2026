[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
    { access = "read", path = "../fixtures" },
    { access = "read-write", path = "../artifacts" },
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
