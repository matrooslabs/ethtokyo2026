[package]
name = "mania-gkr-sui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sumcheck/GKR + Zeromorph (BLS12-381) proofs for OSUMANIA_ONCHAIN_RULESET_V1, verified on Sui"

[lib]
name = "mania_gkr_sui"
path = "src/lib.rs"

[[bin]]
name = "mania-gkr-sui"
path = "src/bin/mania-gkr-sui.rs"

[dependencies]
halo2curves = { version = "0.10.0", features = ["std"] }
rayon = "1"
tiny-keccak = { version = "2", features = ["keccak"] }
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
k256 = { version = "0.13", features = ["ecdsa"] }
mania-scoring-core = { path = "../../core" }

[dev-dependencies]
# Reference ZCash serialization (the format Sui's bls12381 natives use) for cross-checks.
bls12_381 = "0.8"
