[package]
name = "mania-gkr-sui-prove-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Standalone HTTP server: POST a play, get its GKR (BLS12-381, Sui) scoring proof back as JSON"

[dependencies]
mania-gkr-sui = { path = "../engine" }
mania-scoring-core = { path = "../../core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hex = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
