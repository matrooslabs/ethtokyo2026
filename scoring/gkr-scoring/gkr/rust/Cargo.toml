[package]
name = "gkr"
version = "0.2.0"
edition = "2021"
description = "GKR prover/verifier (security-fixed fork of swjng/gkr)"

[lib]
name = "gkr"
path = "src/lib.rs"

[[bin]]
name = "gkr-aggregator"
path = "src/bin.rs"
required-features = ["aggregator"]

[[bin]]
name = "gkr-baseline"
path = "src/baseline.rs"

[features]
default = ["aggregator"]
# circom/r1cs/witness conversion, recursive aggregation and CLI. Not needed for the core protocol.
aggregator = ["dep:r1cs-file", "dep:wtns-file", "dep:clap", "dep:serde", "dep:serde_json", "dep:colored", "dep:tera", "dep:num-bigint", "dep:num-traits"]

[dependencies]
# field element
halo2curves = "0.10.0"
ff = "0.13"
# MiMC7 round constants are derived with keccak256 (as in circomlib)
sha3 = "0.10"
num-bigint = { version = "0.4.3", optional = true }
num-traits = { version = "0.2.15", optional = true }
# concurrency
rayon = "1.6"
# utility
itertools = "0.10"

# aggregator-only
r1cs-file = { git = "https://github.com/jeong0982/zeropool-utils", optional = true }
wtns-file = { git = "https://github.com/jeong0982/zeropool-utils", optional = true }
clap = { version = "4.0", features = ["derive"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
colored = { version = "2.0.0", optional = true }
tera = { version = "1", optional = true }


[dev-dependencies]
# Cross-check of the in-crate MiMC7 against the implementation upstream used (GPL-3.0, test-only).
mimc-rs = { git = "https://github.com/jeong0982/mimc-rs" }
ff012 = { package = "ff", version = "0.12" }
